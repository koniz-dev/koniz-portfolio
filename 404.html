<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Nguyễn Anh Kiệt</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/koniz-portfolio/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a23;
      --bar: #1a222d;
      --border: #222c38;
      --text: #e6edf3;
      --muted: #808d9e;
      --green: #7ee787;
      --blue: #79c0ff;
      --pink: #ff7b72;
      --ink: #0b0f14;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f7f6f2;
      --card: #ffffff;
      --bar: #e9e6de;
      --border: #dedad0;
      --text: #1b1f24;
      --muted: #5f6770;
      --green: #116329;
      --blue: #0550ae;
      --pink: #a40e26;
      --ink: #ffffff;
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .window {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .bar {
      display: flex;
      gap: 6px;
      padding: 0.75rem 1rem;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }

    .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
    .bar i:nth-child(2) { background: #febc2e; }
    .bar i:nth-child(3) { background: #28c840; }

    .body { padding: 1.5rem; }
    .prompt { color: var(--green); }
    .err { color: var(--pink); }
    .muted { color: var(--muted); }
    .path { color: var(--blue); overflow-wrap: anywhere; }

    a.home {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      background: var(--green);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    a.home:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.1em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main class="window">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="body">
      <p><span class="prompt">❯</span> cd <span class="path" id="path">/this-page</span></p>
      <p class="err">zsh: no such file or directory (404)</p>
      <p class="muted"># the page you're looking for doesn't exist or has moved</p>
      <p><span class="prompt">❯</span> <span class="cursor" aria-hidden="true"></span></p>
      <a class="home" href="/koniz-portfolio/">cd ~/portfolio</a>
    </div>
  </main>
  <script>
    document.getElementById('path').textContent = decodeURIComponent(location.pathname);
  </script>
</body>
</html>
